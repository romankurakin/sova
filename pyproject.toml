[project]
name = "sova"
version = "1.0.0"
description = "Local document semantic search"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "msgpack>=1.2.1",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
    "pymupdf4llm>=1.28.2",
    "pymupdf-layout>=1.28.2",
    "rich>=15.0.0",
    "sqliteai-vector>=1.0.0",
    "typer>=0.27.1",
]

[project.scripts]
sova = "sova.cli:main"
check = "sova.check:main"
sova-install = "sova.install:install_main"
sova-remove = "sova.install:remove_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sova"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "ty>=0.0.73",
]
